<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" />
      <stop offset="100%" stop-color="#0e0f12" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Card -->
  <rect x="4" y="6" width="56" height="52" rx="10" fill="url(#cardGrad)" stroke="#2d3139" stroke-width="1.5" />

  <!-- Split Crease Shadow -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#000000" stroke-width="2" />
  <line x1="4" y1="33" x2="60" y2="33" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Split Hinge Side Notches -->
  <rect x="2" y="30" width="3" height="4" rx="1.5" fill="#050608" />
  <rect x="59" y="30" width="3" height="4" rx="1.5" fill="#050608" />

  <!-- AeroFlip Minimalist Modern Logo Symbol / Digit -->
  <text x="32" y="42" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="1">88</text>

  <!-- Small Top Right Cyan Accent Dot -->
  <circle cx="50" cy="14" r="3" fill="url(#accentGrad)" filter="url(#glow)" />
</svg>
